{{- /* Illustrative football pitch, top-down. Context: a hero sport item. Home (teal) attacks left to right. */ -}}
<svg class="court" viewBox="0 0 600 320" aria-hidden="true">
  <defs>
    <radialGradient id="heatZoneF">
      <stop offset="0" class="heat-stop" stop-opacity=".5"/>
      <stop offset=".6" class="heat-stop" stop-opacity=".16"/>
      <stop offset="1" class="heat-stop" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect class="court-floor" x="40" y="30" width="520" height="260" rx="3"/>
  <ellipse cx="452" cy="234" rx="70" ry="44" fill="url(#heatZoneF)"/>
  <rect class="court-line" x="40" y="30" width="520" height="260" rx="3"/>
  <path class="court-line" d="M300 30v260"/>
  <circle class="court-line" cx="300" cy="160" r="38"/>
  <rect class="court-line" x="40" y="88" width="76" height="144"/>
  <rect class="court-line" x="484" y="88" width="76" height="144"/>
  <rect class="court-line" x="40" y="126" width="26" height="68"/>
  <rect class="court-line" x="534" y="126" width="26" height="68"/>
  <text class="court-label" x="452" y="272" text-anchor="middle">{{ .zone }}</text>

  <path class="ball-path" id="ballPathF" d="M330 106 Q 380 260 470 222"/>

  <g class="team-home">
    <circle cx="74" cy="160" r="9"/>
    <circle cx="176" cy="246" r="9"/>
    <circle cx="164" cy="188" r="9"/>
    <circle cx="164" cy="130" r="9"/>
    <circle cx="180" cy="72" r="9"/>
    <circle cx="272" cy="224" r="9"/>
    <circle cx="256" cy="160" r="9"/>
    <circle cx="330" cy="106" r="9"/>
    <circle cx="372" cy="202" r="9"/>
    <circle cx="470" cy="222" r="9"/>
    <circle cx="380" cy="90" r="9"/>
  </g>
  <g class="team-away">
    <circle cx="524" cy="160" r="9"/>
    <circle cx="378" cy="260" r="9"/>
    <circle cx="452" cy="194" r="9"/>
    <circle cx="452" cy="126" r="9"/>
    <circle cx="440" cy="62" r="9"/>
    <circle cx="396" cy="156" r="9"/>
    <circle cx="352" cy="202" r="9"/>
    <circle cx="352" cy="116" r="9"/>
    <circle cx="300" cy="202" r="9"/>
    <circle cx="296" cy="88" r="9"/>
    <circle cx="244" cy="154" r="9"/>
  </g>

  <path class="ball-path" d="M378 244v-52" stroke-dasharray="none"/>
  <circle class="pulse" cx="378" cy="260" r="14"/>
  <g class="track">
    <rect x="360" y="242" width="36" height="36" rx="4"/>
    <text x="360" y="236">#3</text>
    <rect x="452" y="204" width="36" height="36" rx="4"/>
    <text x="452" y="198">#7</text>
    <rect x="312" y="88" width="36" height="36" rx="4"/>
    <text x="312" y="82">#8</text>
  </g>

  <circle class="ball" r="6">
    <animateMotion dur="3.4s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.7;1" calcMode="linear">
      <mpath href="#ballPathF" xlink:href="#ballPathF" xmlns:xlink="http://www.w3.org/1999/xlink"/>
    </animateMotion>
  </circle>
</svg>
