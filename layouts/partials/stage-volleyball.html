{{- /* Illustrative volleyball court. Context: a hero sport item. */ -}}
<svg class="court" viewBox="0 0 600 320" aria-hidden="true">
  <defs>
    <radialGradient id="heatZoneV">
      <stop offset="0" class="heat-stop" stop-opacity=".55"/>
      <stop offset=".6" class="heat-stop" stop-opacity=".18"/>
      <stop offset="1" class="heat-stop" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect class="court-floor" x="60" y="40" width="480" height="240" rx="3"/>
  <ellipse cx="480" cy="92" rx="72" ry="52" fill="url(#heatZoneV)"/>
  <rect class="court-line" x="60" y="40" width="480" height="240" rx="3"/>
  <path class="court-line thin" d="M220 40v240M380 40v240"/>
  <path class="court-net" d="M300 26v268"/>
  <circle class="net-post" cx="300" cy="26" r="4"/>
  <circle class="net-post" cx="300" cy="294" r="4"/>
  <text class="court-label" x="480" y="60" text-anchor="middle">{{ .zone }}</text>

  <path class="ball-path" id="ballPathV" d="M44 226 Q 250 -10 470 98"/>

  <g class="team-home">
    <circle cx="36" cy="232" r="9"/>
    <circle cx="150" cy="112" r="9"/>
    <circle cx="150" cy="210" r="9"/>
    <circle cx="264" cy="90" r="9"/>
    <circle cx="264" cy="160" r="9"/>
    <circle cx="264" cy="232" r="9"/>
  </g>
  <g class="team-away">
    <circle cx="348" cy="74" r="9"/>
    <circle cx="402" cy="152" r="9"/>
    <circle cx="398" cy="238" r="9"/>
    <circle cx="470" cy="104" r="9"/>
    <circle cx="462" cy="186" r="9"/>
    <circle cx="476" cy="256" r="9"/>
  </g>

  <circle class="pulse" cx="470" cy="104" r="14"/>
  <g class="track">
    <rect x="452" y="86" width="36" height="36" rx="4"/>
    <text x="452" y="80">#7</text>
    <rect x="18" y="214" width="36" height="36" rx="4"/>
    <text x="18" y="208">#11</text>
    <rect x="384" y="134" width="36" height="36" rx="4"/>
    <text x="384" y="128">#4</text>
  </g>

  <circle class="ball" r="6">
    <animateMotion dur="3.4s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.7;1" calcMode="linear">
      <mpath href="#ballPathV" xlink:href="#ballPathV" xmlns:xlink="http://www.w3.org/1999/xlink"/>
    </animateMotion>
  </circle>
</svg>
